# Runs all the tests on GitHub after every push, so a broken commit shows a red cross on GitHub.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy  # no screen on the GitHub machine
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4  # Node runs Pyodide for tests/test_web.py
        with:
          node-version: "22"
      - run: npm ci
      # The oldest PHP we support, since we do not know yet which one Pascal's server runs. The laptop has a new one.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: pdo_sqlite
      - run: pip install -e ".[dev]"
      - run: pytest
